[package]
name = "vigie"
version = "0.1.0"
edition = "2024"
default-run = "vigie"
description = "Phone-reachable chat UI driving Claude Code headlessly"

[features]
# What tests build on: the fake `claude` CLI replaying spike recordings, and
# `AppState::for_tests`.
test-support = []

[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"
required-features = ["test-support"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.15"
notify = "8"
parking_lot = "0.12"
rand = "0.10"
rcgen = "0.14"
regex = "1"
reqwest ={ version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
# Turns `test-support` on for the tests of this package.
vigie = { path = ".", features = ["test-support"] }
